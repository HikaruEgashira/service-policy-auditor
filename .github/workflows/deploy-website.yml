name: Deploy Website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'app/website/**'
      - 'app/battacker-web/**'
      - 'packages/core/src/battacker/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@26f6d4f2c533a43e6b5da0b4a5dd983f98f7b49a # v6.0.4
        with:
          version: 9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core package
        run: pnpm --filter libztbs build

      - name: Build battacker-web
        run: pnpm --filter @libztbs/battacker-web build

      - name: Build website
        run: pnpm website:build

      - name: Merge battacker-web into website
        run: |
          mkdir -p app/website/dist/battacker
          cp -r app/battacker-web/dist/* app/website/dist/battacker/
          cp app/battacker-web/dist/index.html app/website/dist/battacker/404.html

      - name: Generate SPA route files
        run: |
          cd app/website/dist
          cp index.html 404.html
          for route in docs privacy terms faq alerts; do
            mkdir -p "$route"
            cp index.html "$route/index.html"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: app/website/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
